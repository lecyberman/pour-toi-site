<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Notre galerie</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/theme.css" />
<style>
  body{ padding:34px 18px calc(90px + env(safe-area-inset-bottom)); }
  .wrap{ max-width:940px; margin:0 auto; position:relative; z-index:2; }
  .tete{ text-align:center; margin-bottom:22px; }
  .tete h1{ font-size:var(--fs-2xl); margin:.3rem 0 .5rem; }
  .tete p{ color:var(--c-encre-douce); max-width:46ch; margin:0 auto; }

  /* ajout d'une photo */
  .ajout{ text-align:center; margin:0 0 26px; }
  .btn-photo{ display:inline-flex; align-items:center; gap:.5em; font-family:var(--font-body); font-weight:700; font-size:1rem;
    color:#fff; background:var(--c-corail); border:none; border-radius:100px; padding:13px 24px; cursor:pointer;
    box-shadow:0 12px 26px -12px rgba(124,82,168,.7); -webkit-tap-highlight-color:transparent; }
  .btn-photo:active{ transform:translateY(1px); }
  .ajout input[type=file]{ display:none; }
  .apercu{ display:none; max-width:360px; margin:16px auto 0; background:var(--surface); border:1px solid var(--bordure);
    border-radius:18px; padding:14px; box-shadow:var(--sh-2); backdrop-filter:blur(var(--verre-blur)); }
  .apercu.on{ display:block; animation:rise .5s var(--ease) both; }
  @keyframes rise{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }
  .apercu img{ width:100%; border-radius:10px; display:block; aspect-ratio:4/5; object-fit:cover; }
  .apercu .u-field{ margin-top:12px; }
  .apercu .row{ display:flex; gap:8px; margin-top:12px; }
  .apercu .row .u-btn{ flex:2; }
  .apercu .annuler{ flex:1; background:transparent; color:var(--c-encre-douce); border:1px solid var(--bordure-forte);
    border-radius:var(--r-pill); padding:10px; cursor:pointer; font-family:var(--font-body); font-weight:600; }

  .grille{ columns:3 220px; column-gap:16px; }
  .cadre{
    break-inside:avoid; margin:0 0 16px; background:#fff; padding:10px 10px 14px;
    border-radius:6px; box-shadow:var(--sh-2); cursor:pointer;
    transform:rotate(var(--r,0deg)); transition:transform var(--t-med) var(--ease), box-shadow var(--t-med);
  }
  .cadre:hover{ transform:rotate(0deg) translateY(-3px) scale(1.02); box-shadow:var(--sh-3); z-index:5; position:relative; }
  .cadre .vue{ width:100%; border-radius:3px; display:block; background:linear-gradient(135deg,#EFE3EC,#F6DED8); aspect-ratio:4/5; object-fit:cover; }
  .cadre .ph{ display:flex; align-items:center; justify-content:center; font-size:2.4rem; color:#C9A9C0; }
  .cadre .leg{ font-family:var(--font-display); font-style:italic; font-size:.95rem; color:var(--c-encre); text-align:center; margin-top:10px; padding:0 4px; }
  .cadre .dt{ font-size:.74rem; color:var(--c-encre-douce); text-align:center; margin-top:3px; }

  /* plein écran */
  .plein{ position:fixed; inset:0; z-index:50; background:rgba(16,14,28,.92); display:none; align-items:center; justify-content:center; padding:20px; }
  .plein.on{ display:flex; }
  .plein img{ max-width:min(92vw,700px); max-height:78vh; border-radius:8px; box-shadow:0 30px 80px rgba(0,0,0,.6); }
  .plein .ph{ width:min(80vw,420px); aspect-ratio:4/5; background:linear-gradient(135deg,#3A3150,#5A4A55); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:4rem; color:#B79FB0; }
  .plein .leg{ position:absolute; bottom:6vh; left:0; right:0; text-align:center; color:#F3EEF6; font-family:var(--font-display); font-style:italic; font-size:1.2rem; padding:0 20px; }
  .plein .fermer{ position:absolute; top:max(18px,env(safe-area-inset-top)); right:20px; background:none; border:none; color:#fff; font-size:1.6rem; cursor:pointer; }

  .note{ text-align:center; font-size:.9rem; color:var(--c-encre-douce); margin-top:26px; }
  .liens{ margin-top:22px; text-align:center; font-size:.92rem; color:var(--c-encre-douce); }
  .liens a{ color:var(--c-corail); text-decoration:none; font-weight:600; }
  @media (max-width:640px){ .grille{ columns:2 150px; } }
</style>
</head>
<body class="u-theme u-grain">
<div class="wrap">
  <div class="tete u-reveal">
    <p class="u-eyebrow">des instants précieux</p>
    <h1 class="u-display">Notre galerie</h1>
    <p>Chaque photo est un souvenir gardé, pas une image jetée sur une page. Ajoute les tiennes, touche-en une pour la voir en grand.</p>
  </div>

  <div class="ajout u-reveal">
    <button class="btn-photo u-magnet" id="btnPhoto" type="button">📷 Ajouter une photo</button>
    <input type="file" id="fichierPhoto" accept="image/*" />
    <div class="apercu" id="apercu">
      <img id="apercuImg" alt="Aperçu de la photo" />
      <input class="u-field" id="apercuLeg" type="text" placeholder="Une légende, un mot… (facultatif)" maxlength="120" />
      <div class="row">
        <button class="u-btn u-magnet" id="apercuGarder" type="button">Garder ce souvenir</button>
        <button class="annuler" id="apercuAnnuler" type="button">Annuler</button>
      </div>
      <p class="u-state" id="apercuState"></p>
    </div>
  </div>

  <div class="grille" id="grille"></div>

  <p class="note" id="note" hidden>Aucune vraie photo pour l'instant. Ajoute la première avec le bouton 📷 juste au-dessus.</p>
  <p class="liens"><a href="/">⌂ accueil</a> · <a href="/histoire">notre histoire</a> · <a href="/dadoucherie">ta page</a></p>
</div>

<div class="plein" id="plein" role="dialog" aria-modal="true">
  <button class="fermer" id="pfermer" aria-label="Fermer">✕</button>
  <div id="pcontenu"></div>
  <div class="leg" id="pleg"></div>
</div>

<script src="/db.js"></script>
<script src="/app.js"></script>
<script>
(function(){
  var grille=document.getElementById('grille');
  var plein=document.getElementById('plein'), pcontenu=document.getElementById('pcontenu'), pleg=document.getElementById('pleg');

  function esc(s){ return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function ajouterCarte(it, prepend){
    var i = grille.children.length;
    var c=document.createElement('div'); c.className='cadre u-reveal is-in';
    c.style.setProperty('--r', (((i%3)-1)*1.4)+'deg');
    var vue = it.image ? ('<img class="vue" loading="lazy" src="'+it.image+'" alt="'+esc(it.leg||'souvenir')+'">')
                       : ('<div class="vue ph">'+(it.emoji||'✦')+'</div>');
    c.innerHTML = vue + (it.leg?'<div class="leg">'+esc(it.leg)+'</div>':'') + (it.dt?'<div class="dt">'+esc(it.dt)+'</div>':'');
    c.addEventListener('click', function(){ ouvrir(it); });
    if(prepend && grille.firstChild){ grille.insertBefore(c, grille.firstChild); } else { grille.appendChild(c); }
  }

  function ouvrir(it){
    pcontenu.innerHTML = it.image ? '<img src="'+it.image+'" alt="'+esc(it.leg||'')+'">' : '<div class="ph">'+(it.emoji||'✦')+'</div>';
    pleg.textContent = it.texte || it.leg || '';
    plein.classList.add('on');
  }
  document.getElementById('pfermer').addEventListener('click', function(){ plein.classList.remove('on'); });
  plein.addEventListener('click', function(e){ if(e.target===plein) plein.classList.remove('on'); });

  // ---- chargement ----
  Promise.all([ DB.select('photos','order=created_at.desc'), DB.select('galerie','order=created_at.desc') ]).then(function(res){
    var items=[];
    (res[0]||[]).forEach(function(p){ items.push({image:p.image, leg:p.legende, dt:p.date, emoji:p.emoji}); });
    (res[1]||[]).forEach(function(g){ items.push({image:g.image, leg:g.titre, dt:'', emoji:g.emoji, texte:g.texte}); });
    if(!items.length){
      var ph=[['🌙','Le premier soir'],['✨','La première fois qu\'on a ri'],['🌊','Malte, la lumière'],['🎆','Barcelone, la nuit'],['🕯️','Un dimanche sans rien'],['💫','Notre nuit']];
      ph.forEach(function(p){ items.push({image:null, leg:p[1], emoji:p[0]}); });
      document.getElementById('note').hidden=false;
    }
    items.forEach(function(it){ ajouterCarte(it, false); });
  });

  // ===== ajout d'une photo depuis le téléphone =====
  var fichier=document.getElementById('fichierPhoto'), apercu=document.getElementById('apercu'),
      apercuImg=document.getElementById('apercuImg'), apercuLeg=document.getElementById('apercuLeg'),
      apercuState=document.getElementById('apercuState');
  var dataURL=null;

  document.getElementById('btnPhoto').addEventListener('click', function(){ if(window.buzzDoux) window.buzzDoux(8); fichier.click(); });

  fichier.addEventListener('change', function(){
    var f=fichier.files && fichier.files[0]; if(!f) return;
    apercuState.textContent='Préparation de la photo…'; apercuState.className='u-state';
    compresser(f, function(url){
      dataURL=url; apercuImg.src=url; apercu.classList.add('on'); apercuState.textContent='';
      apercu.scrollIntoView({behavior:'smooth', block:'center'});
    });
  });

  document.getElementById('apercuAnnuler').addEventListener('click', function(){
    apercu.classList.remove('on'); dataURL=null; fichier.value=''; apercuLeg.value='';
  });

  document.getElementById('apercuGarder').addEventListener('click', function(){
    if(!dataURL) return;
    if(window.buzzDoux) window.buzzDoux(12);
    var btn=this, leg=apercuLeg.value.trim();
    var dateStr=new Date().toLocaleDateString('fr-FR',{day:'numeric', month:'long', year:'numeric'});
    var save=function(){ return DB.insert('photos',{ image:dataURL, legende:leg||null, date:dateStr }); };
    var done=function(){
      ajouterCarte({image:dataURL, leg:leg, dt:dateStr}, true);
      document.getElementById('note').hidden=true;
      apercu.classList.remove('on'); dataURL=null; fichier.value=''; apercuLeg.value='';
    };
    if(window.App && App.submit){ App.submit(btn, apercuState, save, 'Gardé précieusement. 💜').then(function(ok){ if(ok!==false) done(); }); }
    else { save().then(done).catch(function(){ apercuState.textContent='Un souci est survenu. Réessaie.'; apercuState.className='u-state u-state--err'; }); }
  });

  function compresser(file, cb){
    var reader=new FileReader();
    reader.onload=function(){
      var img=new Image();
      img.onload=function(){
        var max=1100, w=img.width, h=img.height;
        if(w>h && w>max){ h=Math.round(h*max/w); w=max; }
        else if(h>=w && h>max){ w=Math.round(w*max/h); h=max; }
        var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        try{ cb(cv.toDataURL('image/jpeg',0.82)); }catch(e){ cb(reader.result); }
      };
      img.onerror=function(){ cb(reader.result); };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  }
})();
</script>
  <script src="/presence.js" defer></script>
</body>
</html>
