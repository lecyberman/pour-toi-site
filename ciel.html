<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0b0a16" />
<title>Notre ciel partagé</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; color:#EDE9F3; font-family:'Nunito Sans',system-ui,sans-serif;
    background:
      radial-gradient(120% 90% at 50% -10%, #241d40 0%, transparent 55%),
      radial-gradient(90% 70% at 50% 115%, #16203f 0%, transparent 60%),
      #0b0a16; overflow-x:hidden; }
  a.retour{ position:fixed; top:calc(12px + env(safe-area-inset-top)); left:14px; z-index:3; font-size:.9rem; color:rgba(237,233,243,.72); text-decoration:none;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:100px; padding:7px 14px; }
  a.retour:hover{ color:#fff; }
  .wrap{ max-width:600px; margin:0 auto; padding:max(62px,env(safe-area-inset-top)) 20px calc(50px + env(safe-area-inset-bottom)); }
  .tete{ text-align:center; margin-bottom:20px; }
  .eyebrow{ font-family:'Fraunces',serif; font-style:italic; color:#C7B2E6; font-size:1.06rem; margin:0 0 .3rem; }
  h1{ font-family:'Fraunces',serif; font-weight:500; font-size:clamp(2rem,7vw,2.6rem); margin:0; color:#FBF4EA; }

  .villes{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:8px; }
  @media (max-width:420px){ .villes{ grid-template-columns:1fr; } }
  .carte{ background:rgba(255,255,255,.05); border:1px solid rgba(180,155,218,.24); border-radius:20px; padding:20px 16px; text-align:center; }
  .carte .qui{ font-family:'Fraunces',serif; font-style:italic; color:#B49BDA; font-size:.95rem; margin:0 0 2px; }
  .carte .ville{ font-family:'Nunito Sans',sans-serif; font-weight:700; font-size:1.05rem; color:#FBF4EA; margin:0 0 10px; min-height:1.25em; }
  .carte .ic{ font-size:3.2rem; line-height:1; margin:4px 0 6px; min-height:3.2rem; }
  .carte .temp{ font-family:'Fraunces',serif; font-weight:500; font-size:2rem; color:#F1ECF8; }
  .carte .desc{ color:#C9C1D8; font-size:.9rem; margin-top:4px; min-height:1.2em; }
  .carte .heure{ color:rgba(201,193,216,.6); font-size:.8rem; margin-top:8px; min-height:1em; }

  .liaison{ text-align:center; margin:22px auto 0; }
  .liaison .coeur{ font-size:1.4rem; }
  .liaison .mot{ font-family:'Fraunces',serif; font-style:italic; color:#E9DEF7; font-size:1.14rem; line-height:1.7; max-width:34ch; margin:10px auto 0; min-height:3.2em; transition:opacity .5s; }

  .reglage{ margin:24px auto 0; width:100%; max-width:400px; background:rgba(255,255,255,.04); border:1px solid rgba(180,155,218,.2); border-radius:16px; padding:16px; }
  .reglage h2{ font-family:'Fraunces',serif; font-weight:500; font-size:1.02rem; margin:0 0 10px; color:#FBF4EA; }
  .reglage .row{ display:flex; gap:8px; }
  .reglage input{ flex:1; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.16); border-radius:12px; color:#EDE9F3; padding:11px 12px; font-family:inherit; font-size:.95rem; }
  .reglage input:focus{ outline:2px solid #A886DA; }
  .reglage button{ font-family:inherit; font-weight:700; font-size:.9rem; color:#1a1430; background:linear-gradient(135deg,#CBB4EC,#A886DA); border:none; border-radius:100px; padding:11px 16px; cursor:pointer; white-space:nowrap; }
  .reglage .pos{ margin-top:10px; width:100%; background:rgba(255,255,255,.07); color:#EDE9F3; border:1px solid rgba(255,255,255,.18); }
  .reglage .ok{ color:#8ee6a0; font-size:.82rem; margin-top:10px; min-height:1em; }
  .reglage .note{ color:rgba(201,193,216,.7); font-size:.8rem; margin-top:8px; }
  .maj{ text-align:center; color:rgba(201,193,216,.55); font-size:.78rem; margin-top:16px; }
  .maj a{ color:#B49BDA; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <a class="retour" href="/">⌂ Accueil</a>
  <div class="wrap">
    <div class="tete">
      <p class="eyebrow">le même moment, deux ciels</p>
      <h1>Notre ciel partagé</h1>
    </div>

    <div class="villes">
      <div class="carte" id="c-elle">
        <p class="qui" id="q-elle">chez toi</p>
        <p class="ville" id="v-elle">…</p>
        <div class="ic" id="i-elle">🌫️</div>
        <div class="temp" id="t-elle"></div>
        <div class="desc" id="d-elle">on regarde le ciel…</div>
        <div class="heure" id="h-elle"></div>
      </div>
      <div class="carte" id="c-lui">
        <p class="qui" id="q-lui">chez Mathieu</p>
        <p class="ville" id="v-lui">…</p>
        <div class="ic" id="i-lui">🌫️</div>
        <div class="temp" id="t-lui"></div>
        <div class="desc" id="d-lui">on regarde le ciel…</div>
        <div class="heure" id="h-lui"></div>
      </div>
    </div>

    <div class="liaison">
      <div class="coeur">🤍</div>
      <p class="mot" id="mot">Où que soient nos deux ciels, ils regardent la même lune.</p>
    </div>

    <div class="reglage" id="reglage">
      <h2 id="reg-titre">Où es-tu en ce moment ?</h2>
      <div class="row">
        <input type="text" id="in-ville" placeholder="ta ville (ex : Marseille, Lyon, Paris…)" />
        <button id="save">Poser</button>
      </div>
      <button class="pos" id="geoloc">📍 utiliser ma position</button>
      <p class="ok" id="okmsg"></p>
      <p class="note" id="reg-note"></p>
    </div>

    <p class="maj">Météo en direct. <a id="rafraichir">rafraîchir</a></p>
  </div>

<script>
(function(){
  "use strict";
  var URL_SB = "https://jnqyjpgbmjclxbjxbnft.supabase.co";
  var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpucXlqcGdibWpjbHhianhibmZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTg0ODIsImV4cCI6MjA5MjYzNDQ4Mn0.zr0iYxqubZwH34Lj61QGo4yS7ScldKNVxrK7rnMw9E8";
  function hdrs(extra){ var h={ "apikey":ANON, "Authorization":"Bearer "+ANON, "Content-Type":"application/json" }; for(var k in (extra||{})) h[k]=extra[k]; return h; }
  function role(){ try{ var r=localStorage.getItem("moi_role"); return (r==="elle"||r==="lui")?r:null; }catch(e){ return null; } }
  function $(id){ return document.getElementById(id); }
  var NOMS = { elle:"dadoucherie", lui:"Mathieu" };

  var loc = { elle:null, lui:null };

  function meteoInfo(code){
    if(code === 0) return { ic:"☀️", t:"ciel dégagé", g:"soleil" };
    if(code === 1 || code === 2) return { ic:"🌤️", t:"quelques nuages", g:"doux" };
    if(code === 3) return { ic:"☁️", t:"ciel couvert", g:"gris" };
    if(code === 45 || code === 48) return { ic:"🌫️", t:"brouillard", g:"brume" };
    if(code >= 51 && code <= 57) return { ic:"🌦️", t:"bruine", g:"pluie" };
    if(code >= 61 && code <= 67) return { ic:"🌧️", t:"pluie", g:"pluie" };
    if(code >= 71 && code <= 77) return { ic:"❄️", t:"neige", g:"neige" };
    if(code >= 80 && code <= 82) return { ic:"🌧️", t:"averses", g:"pluie" };
    if(code === 85 || code === 86) return { ic:"🌨️", t:"averses de neige", g:"neige" };
    if(code >= 95) return { ic:"⛈️", t:"orage", g:"orage" };
    return { ic:"🌡️", t:"", g:"doux" };
  }

  function memeVille(){
    if(!loc.elle || !loc.lui) return false;
    return Math.abs(loc.elle.lat-loc.lui.lat) < 0.4 && Math.abs(loc.elle.lon-loc.lui.lon) < 0.4;
  }
  function motTendre(gElle, gLui){
    if(memeVille()) return "Vous êtes sous le même ciel en ce moment. Profite, c'est rare et c'est précieux. 🤍";
    if(gElle === "pluie" || gElle === "orage") return "Il pleut sur ton ciel. Imagine que je tiens le parapluie, tout contre toi.";
    if(gElle === "neige") return "Il neige chez toi. Mets-toi au chaud, je te réchaufferais si j'étais là.";
    if(gElle === "soleil" && gLui !== "soleil") return "Tu as le soleil, j'ai le gris. Garde-m'en un peu pour la prochaine fois.";
    if(gElle === "soleil" && gLui === "soleil") return "Le même soleil sur nous deux aujourd'hui. C'est déjà un peu être ensemble.";
    if(gElle === "brume") return "Un peu de brume sur ton ciel. Moi je te vois clairement, même de loin.";
    if(gLui === "pluie" || gLui === "orage") return "Il pleut de mon côté, mais penser à toi, ça met du soleil.";
    return "Deux ciels différents, une seule pensée : toi.";
  }

  // ---- Supabase : lire / écrire les localisations ----
  function lireLoc(){
    return fetch(URL_SB+"/rest/v1/localisation?select=role,ville,lat,lon", { headers:hdrs() })
      .then(function(r){ return r.json(); })
      .then(function(rows){ (rows||[]).forEach(function(x){ loc[x.role] = x; }); })
      .catch(function(){});
  }
  function ecrireLoc(r, ville, lat, lon){
    // upsert : on tente un PATCH, sinon POST
    return fetch(URL_SB+"/rest/v1/localisation?role=eq."+r, {
      method:"PATCH", headers:hdrs({ "Prefer":"return=representation" }),
      body: JSON.stringify({ ville:ville, lat:lat, lon:lon, updated_at:new Date().toISOString() })
    }).then(function(res){ return res.json(); }).then(function(out){
      if(out && out.length) return out;
      return fetch(URL_SB+"/rest/v1/localisation", { method:"POST", headers:hdrs({ "Prefer":"return=minimal" }),
        body: JSON.stringify({ role:r, ville:ville, lat:lat, lon:lon }) });
    });
  }

  // ---- open-meteo : géocodage + météo ----
  function geocoder(nom){
    return fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=fr&format=json&name="+encodeURIComponent(nom))
      .then(function(r){ return r.json(); })
      .then(function(j){ var x = j && j.results && j.results[0]; if(!x) return null; return { ville:x.name, lat:x.latitude, lon:x.longitude }; });
  }
  function meteo(v){
    return fetch("https://api.open-meteo.com/v1/forecast?latitude="+v.lat+"&longitude="+v.lon+"&current=temperature_2m,weather_code,is_day&timezone=auto")
      .then(function(r){ return r.json(); })
      .then(function(j){ var c = j && j.current; if(!c) return null; return { temp:Math.round(c.temperature_2m), code:c.weather_code, heure:c.time }; });
  }

  function libelleQui(){
    var moi = role();
    $("q-elle").textContent = (moi === "elle") ? "chez toi" : "chez dadoucherie";
    $("q-lui").textContent  = (moi === "lui")  ? "chez toi" : "chez Mathieu";
  }

  function rendreCarte(pref, r){
    var v = loc[r];
    if(!v || v.lat == null){
      $("v"+pref).textContent = "à définir";
      $("i"+pref).textContent = "…";
      $("t"+pref).textContent = "";
      $("d"+pref).textContent = (role()===r) ? "dis-moi où tu es 👇" : "en attente de sa ville";
      $("h"+pref).textContent = "";
      return Promise.resolve(null);
    }
    $("v"+pref).textContent = v.ville || "sa position";
    return meteo(v).then(function(m){
      if(!m){ $("d"+pref).textContent = "ciel indisponible"; return null; }
      var info = meteoInfo(m.code);
      $("i"+pref).textContent = info.ic;
      $("t"+pref).textContent = m.temp + "°";
      $("d"+pref).textContent = info.t;
      try{ var hm=(m.heure||"").split("T")[1]; if(hm) $("h"+pref).textContent = "il est "+hm.slice(0,5)+" là-bas"; }catch(e){}
      return info.g;
    });
  }

  function rendre(){
    libelleQui();
    Promise.all([ rendreCarte("-elle","elle"), rendreCarte("-lui","lui") ]).then(function(res){
      var gElle=res[0], gLui=res[1];
      if(gElle && gLui){ var m=$("mot"); m.style.opacity=0; setTimeout(function(){ m.textContent=motTendre(gElle,gLui); m.style.opacity=1; }, 300); }
      else if(memeVille()){ $("mot").textContent = motTendre(); }
    });
  }

  // ---- réglage (pour la personne connectée) ----
  function majReglage(){
    var moi = role();
    if(!moi){ $("reg-titre").textContent = "Qui es-tu ?"; $("reg-note").textContent = "Choisis qui tu es dans le badge en haut, puis reviens poser ta ville."; $("in-ville").disabled=true; $("save").disabled=true; $("geoloc").disabled=true; return; }
    $("in-ville").disabled=false; $("save").disabled=false; $("geoloc").disabled=false;
    $("reg-titre").textContent = "Où es-tu en ce moment ?";
    var v = loc[moi];
    $("reg-note").textContent = v && v.ville ? ("Actuellement : "+v.ville+". Change quand tu bouges.") : "Pose ta ville, "+NOMS[moi]+" verra ton ciel.";
    if(v && v.ville) $("in-ville").value = v.ville;
  }
  function enregistrer(ville, lat, lon){
    var moi = role(); if(!moi) return;
    $("okmsg").style.color="#8ee6a0"; $("okmsg").textContent="…";
    ecrireLoc(moi, ville, lat, lon).then(function(){ loc[moi]={role:moi,ville:ville,lat:lat,lon:lon}; $("okmsg").textContent="C'est posé 🤍"; majReglage(); rendre(); })
      .catch(function(){ $("okmsg").style.color="#e6a6a6"; $("okmsg").textContent="Oups, réessaie."; });
  }

  $("save").addEventListener("click", function(){
    var nom = $("in-ville").value.trim();
    if(!nom){ $("okmsg").style.color="#e6a6a6"; $("okmsg").textContent="Écris une ville d'abord."; return; }
    $("okmsg").style.color="#8ee6a0"; $("okmsg").textContent="je cherche…";
    geocoder(nom).then(function(g){ if(!g){ $("okmsg").style.color="#e6a6a6"; $("okmsg").textContent="Ville introuvable, réessaie."; return; } enregistrer(g.ville, g.lat, g.lon); });
  });
  $("geoloc").addEventListener("click", function(){
    if(!navigator.geolocation){ $("okmsg").style.color="#e6a6a6"; $("okmsg").textContent="Position non disponible sur cet appareil."; return; }
    $("okmsg").style.color="#8ee6a0"; $("okmsg").textContent="je te localise…";
    navigator.geolocation.getCurrentPosition(function(p){
      enregistrer("ma position", p.coords.latitude, p.coords.longitude);
    }, function(){ $("okmsg").style.color="#e6a6a6"; $("okmsg").textContent="Localisation refusée. Écris ta ville à la place."; }, { timeout:10000 });
  });
  document.getElementById("rafraichir").addEventListener("click", rendre);

  lireLoc().then(function(){ majReglage(); rendre(); });
})();
</script>
<script src="/presence.js" defer></script>
</body>
</html>
