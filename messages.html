<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0b0a16" />
<title>Notre chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; color:#EDE9F3; font-family:'Nunito Sans',system-ui,sans-serif;
    background:
      radial-gradient(120% 90% at 50% -10%, #241d40 0%, transparent 55%),
      radial-gradient(90% 70% at 50% 115%, #17152f 0%, transparent 60%),
      #0b0a16; }
  .app{ display:flex; flex-direction:column; height:100dvh; max-width:600px; margin:0 auto; }
  .barre{ display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top)) 14px 10px; border-bottom:1px solid rgba(180,155,218,.16); }
  .barre a.retour{ font-size:.85rem; color:rgba(237,233,243,.72); text-decoration:none; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:100px; padding:6px 12px; }
  .barre .t{ flex:1; text-align:center; }
  .barre .t h1{ font-family:'Fraunces',serif; font-weight:500; font-size:1.25rem; margin:0; color:#FBF4EA; }
  .barre .t .st{ font-size:.72rem; color:rgba(201,193,216,.7); }
  .barre .effacer{ font-size:.8rem; color:#d9a2a2; background:rgba(255,255,255,.05); border:1px solid rgba(217,162,162,.3); border-radius:100px; padding:6px 11px; cursor:pointer; }

  .fil{ flex:1; overflow-y:auto; padding:16px 14px 8px; display:flex; flex-direction:column; gap:8px; }
  .note{ text-align:center; color:rgba(201,193,216,.6); font-size:.78rem; margin:6px auto 10px; max-width:32ch; font-style:italic; }
  .bulle{ max-width:78%; padding:11px 15px; border-radius:20px; font-size:1.04rem; line-height:1.5; white-space:pre-line; word-wrap:break-word; animation:pop .25s ease; }
  @keyframes pop{ from{ opacity:0; transform:translateY(6px) scale(.98);} to{ opacity:1; transform:none; } }
  .bulle.moi{ align-self:flex-end; color:#1a1430; background:linear-gradient(135deg,#CBB4EC,#A886DA); border-bottom-right-radius:6px; }
  .bulle.autre{ align-self:flex-start; background:rgba(255,255,255,.08); border:1px solid rgba(180,155,218,.2); border-bottom-left-radius:6px; }
  .bulle .h{ display:block; margin-top:5px; font-size:.68rem; opacity:.6; text-align:right; }
  .fade{ animation:sortir .6s ease forwards; }
  @keyframes sortir{ to{ opacity:0; transform:translateY(-6px) scale(.96); } }
  .vide{ text-align:center; color:#9488ab; font-style:italic; margin:auto; padding:20px; line-height:1.7; }

  .saisie{ display:flex; gap:8px; padding:10px 12px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid rgba(180,155,218,.16); }
  .saisie input{ flex:1; background:rgba(255,255,255,.06); border:1px solid rgba(180,155,218,.28); border-radius:100px; color:#F1ECF8; padding:13px 16px; font-family:inherit; font-size:1rem; }
  .saisie input:focus{ outline:2px solid rgba(168,134,218,.5); }
  .saisie button{ border:none; border-radius:50%; width:48px; height:48px; cursor:pointer; color:#1a1430; background:linear-gradient(135deg,#CBB4EC,#A886DA); font-size:1.2rem; box-shadow:0 10px 24px -12px rgba(168,134,218,.9); }
  .saisie button:disabled{ opacity:.5; }

  .chooser{ margin:auto; text-align:center; padding:30px; }
  .chooser p{ color:#B7ACCB; margin-bottom:14px; }
  .chooser button{ font-family:inherit; font-weight:700; font-size:.95rem; border-radius:100px; padding:11px 18px; margin:0 5px; cursor:pointer; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.06); color:#EDE9F3; }
  .chooser button.p{ color:#1a1430; background:linear-gradient(135deg,#CBB4EC,#A886DA); border-color:transparent; }
</style>
</head>
<body>
  <div class="app">
    <div class="barre">
      <a class="retour" href="/">⌂</a>
      <div class="t"><h1>Notre chat</h1><div class="st" id="st">rien que nous deux</div></div>
      <button class="effacer" id="effacer" title="Tout effacer">🔥</button>
    </div>
    <div class="fil" id="fil"></div>
    <div class="saisie" id="saisie">
      <input type="text" id="texte" placeholder="Écris un mot…" autocomplete="off" />
      <button id="envoyer" aria-label="Envoyer">➤</button>
    </div>
  </div>

<script>
(function(){
  "use strict";
  var URL_SB = "https://jnqyjpgbmjclxbjxbnft.supabase.co";
  var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpucXlqcGdibWpjbHhianhibmZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTg0ODIsImV4cCI6MjA5MjYzNDQ4Mn0.zr0iYxqubZwH34Lj61QGo4yS7ScldKNVxrK7rnMw9E8";
  function hdrs(extra){ var h={ "apikey":ANON, "Authorization":"Bearer "+ANON, "Content-Type":"application/json" }; for(var k in (extra||{})) h[k]=extra[k]; return h; }
  function role(){ try{ var r=localStorage.getItem("moi_role"); return (r==="elle"||r==="lui")?r:null; }catch(e){ return null; } }
  function $(id){ return document.getElementById(id); }
  function esc(s){ return (s||"").replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
  function hhmm(iso){ try{ return new Date(iso).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ""; } }
  var GRACE_MS = 10000; // les messages lus disparaissent 10 s après lecture

  function lire(){ return fetch(URL_SB+"/rest/v1/messages?order=created_at.asc&select=id,texte,de_role,lu,lu_at,created_at",{ headers:hdrs() }).then(function(r){ return r.ok?r.json():[]; }).catch(function(){ return []; }); }
  function envoyerMsg(t){ var moi=role(); return fetch(URL_SB+"/rest/v1/messages",{ method:"POST", headers:hdrs({ "Prefer":"return=minimal" }), body:JSON.stringify({ texte:t, de_role:moi }) }); }
  function marquerLu(ids){ if(!ids.length) return Promise.resolve(); return fetch(URL_SB+"/rest/v1/messages?id=in.("+ids.join(",")+")",{ method:"PATCH", headers:hdrs({ "Prefer":"return=minimal" }), body:JSON.stringify({ lu:true, lu_at:new Date().toISOString() }) }); }
  function purger(){ var seuil=new Date(Date.now()-GRACE_MS).toISOString(); return fetch(URL_SB+"/rest/v1/messages?lu=eq.true&lu_at=lt."+encodeURIComponent(seuil),{ method:"DELETE", headers:hdrs({ "Prefer":"return=minimal" }) }).catch(function(){}); }
  function toutEffacer(){ return fetch(URL_SB+"/rest/v1/messages?id=not.is.null",{ method:"DELETE", headers:hdrs({ "Prefer":"return=minimal" }) }).catch(function(){}); }

  var fil=$("fil"), connus={};
  function rendre(rows){
    var moi=role();
    // vider si plus rien
    if(!rows.length){ if(!fil.querySelector(".vide")){ fil.innerHTML='<p class="vide">Écris le premier mot 🤍<br>Ce qui se dit ici s\'efface une fois lu.</p>'; } connus={}; return; }
    var videEl=fil.querySelector(".vide"); if(videEl) videEl.remove();
    var vus={};
    rows.forEach(function(m){
      vus[m.id]=1;
      if(!connus[m.id]){
        var b=document.createElement("div");
        b.className="bulle "+(m.de_role===moi?"moi":"autre");
        b.id="m_"+m.id;
        b.innerHTML=esc(m.texte)+'<span class="h">'+hhmm(m.created_at)+'</span>';
        fil.appendChild(b); connus[m.id]=b;
      }
    });
    // retirer visuellement ceux qui ont disparu (purgés)
    Object.keys(connus).forEach(function(id){
      if(!vus[id]){ var el=connus[id]; if(el&&!el._out){ el._out=true; el.classList.add("fade"); setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },600); } delete connus[id]; }
    });
    fil.scrollTop=fil.scrollHeight;
  }

  function cycle(){
    if(!role()) return;
    lire().then(function(rows){
      rendre(rows);
      var moi=role();
      var aLire=rows.filter(function(m){ return m.de_role!==moi && !m.lu; }).map(function(m){ return m.id; });
      var p = aLire.length ? marquerLu(aLire) : Promise.resolve();
      p.then(purger);
    });
  }

  function demarrer(){
    $("saisie").style.display="flex";
    cycle();
    setInterval(cycle, 3000);
  }

  function envoyer(){
    var t=$("texte").value.trim(); if(!t) return;
    $("texte").value="";
    envoyerMsg(t).then(function(){ cycle(); });
  }
  $("envoyer").addEventListener("click", envoyer);
  $("texte").addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); envoyer(); } });
  $("effacer").addEventListener("click", function(){ if(confirm("Tout effacer, pour vous deux ?")){ toutEffacer().then(cycle); } });

  // choix d'identité si besoin
  if(!role()){
    fil.innerHTML='<div class="chooser"><p>Qui es-tu ?</p><div><button class="p" data-r="lui">Mathieu</button><button data-r="elle">dadoucherie</button></div></div>';
    $("saisie").style.display="none";
    fil.addEventListener("click", function(e){ var b=e.target.closest?e.target.closest("[data-r]"):null; if(!b) return; try{ localStorage.setItem("moi_role", b.getAttribute("data-r")); }catch(e2){} fil.innerHTML=""; demarrer(); });
  } else {
    demarrer();
  }
})();
</script>
<script src="/presence.js" defer></script>
</body>
</html>
