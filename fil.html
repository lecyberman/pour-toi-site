<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0b0a16" />
<title>Le fil invisible</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; color:#EDE9F3; font-family:'Nunito Sans',system-ui,sans-serif;
    background:
      radial-gradient(120% 90% at 50% -10%, #1c1740 0%, transparent 55%),
      radial-gradient(90% 70% at 50% 115%, #14173a 0%, transparent 60%),
      #0b0a16; overflow-x:hidden; }
  a.retour{ position:fixed; top:calc(12px + env(safe-area-inset-top)); left:14px; z-index:5; font-size:.9rem; color:rgba(237,233,243,.72); text-decoration:none;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:100px; padding:7px 14px; }
  a.retour:hover{ color:#fff; }
  #fil-canvas{ position:fixed; inset:0; z-index:0; }
  .wrap{ position:relative; z-index:1; max-width:520px; margin:0 auto; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    padding:max(64px,env(safe-area-inset-top)) 22px calc(34px + env(safe-area-inset-bottom)); }
  .eyebrow{ font-family:'Fraunces',serif; font-style:italic; color:#C7B2E6; font-size:1.08rem; margin:0 0 .35rem; }
  h1{ font-family:'Fraunces',serif; font-weight:500; font-size:clamp(2rem,7vw,2.7rem); margin:0 0 .1rem; color:#FBF4EA; }
  .msg{ font-family:'Fraunces',serif; font-style:italic; color:#E9DEF7; font-size:1.14rem; line-height:1.6; margin:22px auto 0; max-width:30ch; min-height:3.2em; transition:opacity .5s; }
  .btn{ margin-top:26px; font-family:'Nunito Sans',sans-serif; font-weight:700; font-size:1rem; border-radius:100px; padding:15px 28px; cursor:pointer; border:1px solid transparent;
    color:#1a1430; background:linear-gradient(135deg,#CBB4EC,#A886DA); box-shadow:0 14px 32px -14px rgba(168,134,218,.8); transition:transform .18s ease, box-shadow .3s, opacity .3s; }
  .btn:hover{ transform:translateY(-2px); }
  .btn:disabled{ opacity:.45; cursor:default; transform:none; }
  .sous{ margin-top:16px; color:rgba(201,193,216,.7); font-size:.82rem; max-width:32ch; line-height:1.5; }
  .chooser{ margin-top:18px; display:flex; gap:10px; justify-content:center; }
  .chooser button{ font-family:inherit; font-weight:700; font-size:.95rem; border-radius:100px; padding:11px 18px; cursor:pointer; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.06); color:#EDE9F3; }
  .chooser button.p{ color:#1a1430; background:linear-gradient(135deg,#CBB4EC,#A886DA); border-color:transparent; }
  .changer{ display:inline-block; margin-top:16px; font-size:.82rem; color:#B49BDA; text-decoration:none; opacity:.75; }
  .pastille{ display:inline-flex; align-items:center; gap:8px; margin-top:4px; font-size:.86rem; color:#B7ACCB; }
  .pastille .pt{ width:9px; height:9px; border-radius:50%; background:#6f6a80; box-shadow:0 0 8px transparent; transition:background .4s, box-shadow .4s; }
  .pastille.on .pt{ background:#8ee6a0; box-shadow:0 0 12px #8ee6a0; }
</style>
</head>
<body>
  <a class="retour" href="/">⌂ Accueil</a>
  <canvas id="fil-canvas" aria-hidden="true"></canvas>
  <div class="wrap">
    <p class="eyebrow">un fil de lumière, rien qu'à nous deux</p>
    <h1>Le fil invisible</h1>

    <p class="msg" id="msg">Ce fil nous relie, même quand on ne se voit pas.</p>
    <span class="pastille" id="pastille"><span class="pt"></span><span id="pastille-txt">connexion…</span></span>

    <div id="zone-action">
      <button class="btn" id="tirer" disabled>Tirer sur le fil 🤍</button>
    </div>

    <div class="chooser" id="chooser" hidden style="display:none">
      <button class="p" data-r="lui">Je suis Mathieu</button>
      <button data-r="elle">Je suis dadoucherie</button>
    </div>

    <a href="#" class="changer" id="changer" hidden style="display:none">ce n'est pas toi ? changer</a>
    <p class="sous">Quand vous êtes là tous les deux, le fil s'illumine en entier. Tire dessus : l'autre sentira une petite vibration, où qu'il soit.</p>
  </div>

<script>
(function(){
  "use strict";
  var URL_SB = "https://jnqyjpgbmjclxbjxbnft.supabase.co";
  var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpucXlqcGdibWpjbHhianhibmZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTg0ODIsImV4cCI6MjA5MjYzNDQ4Mn0.zr0iYxqubZwH34Lj61QGo4yS7ScldKNVxrK7rnMw9E8";
  var NOMS = { elle:"dadoucherie", lui:"Mathieu" };
  var AUTRE = { elle:"lui", lui:"elle" };
  function role(){ try{ var r=localStorage.getItem("moi_role"); return (r==="elle"||r==="lui")?r:null; }catch(e){ return null; } }
  var $ = function(id){ return document.getElementById(id); };
  var msg=$("msg"), pastille=$("pastille"), pastilleTxt=$("pastille-txt"), btn=$("tirer"), chooser=$("chooser"), changer=$("changer");

  function setMsg(t){ msg.style.opacity=0; setTimeout(function(){ msg.textContent=t; msg.style.opacity=1; }, 220); }
  function vibrer(pattern){ try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }

  var client=null, canal=null, souscrit=false, autrePresent=false;

  function majIdentite(){
    var moi = role();
    chooser.style.display = moi ? "none" : "flex";
    $("zone-action").style.display = moi ? "" : "none";
    changer.style.display = moi ? "inline-block" : "none";
    if(!moi){ setMsg("Dis-moi qui tu es, et j'allume ton bout du fil."); pastille.classList.remove("on"); pastilleTxt.textContent=""; }
  }

  function renderEtat(){
    var moi = role(); if(!moi) return;
    var nomAutre = NOMS[AUTRE[moi]];
    if(!souscrit){ pastille.classList.remove("on"); pastilleTxt.textContent="connexion…"; btn.disabled=true; return; }
    if(autrePresent){
      pastille.classList.add("on"); pastilleTxt.textContent = nomAutre + " est là, en ce moment";
      btn.disabled=false;
      setMsg("Le fil est allumé en entier. Vous êtes là, tous les deux, reliés. 🤍");
    } else {
      pastille.classList.remove("on"); pastilleTxt.textContent = nomAutre + " n'est pas là pour l'instant";
      btn.disabled=false; // on peut tirer quand même : ça restera comme un petit appel
      setMsg("Le fil t'attend. Tu peux tirer dessus quand même : " + nomAutre + " le sentira dès son retour.");
    }
  }

  function chargerLib(cb){
    if(window.supabase && window.supabase.createClient) return cb();
    var s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
    s.onload=cb; s.onerror=function(){ pastilleTxt.textContent="hors-ligne"; };
    document.head.appendChild(s);
  }

  function demarrer(){
    var moi = role(); if(!moi) return;
    chargerLib(function(){
      if(!window.supabase || !window.supabase.createClient) return;
      try{
        if(!client) client = window.supabase.createClient(URL_SB, ANON, { realtime:{ params:{ eventsPerSecond:5 } } });
        if(canal){ try{ canal.untrack(); client.removeChannel(canal); }catch(e){} canal=null; }
        souscrit=false; autrePresent=false; renderEtat();
        canal = client.channel("nous-deux-live", { config:{ presence:{ key:moi } } });
        canal.on("presence", { event:"sync" }, function(){ maj(moi); });
        canal.on("broadcast", { event:"tir-fil" }, function(p){
          var de = p && p.payload && p.payload.de;
          if(de && de !== moi){ recevoirTir(NOMS[de] || "l'autre"); }
        });
        canal.subscribe(function(st){
          if(st==="SUBSCRIBED"){ souscrit=true; try{ canal.track({ role:moi, page:"/fil", at:Date.now() }); }catch(e){} maj(moi); }
        });
      }catch(e){}
    });
  }
  function maj(moi){
    try{ autrePresent = Object.keys(canal.presenceState()).indexOf(AUTRE[moi]) > -1; }catch(e){ autrePresent=false; }
    renderEtat();
  }

  var pulseUntil=0;
  function recevoirTir(nom){
    vibrer([40,60,40,60,80]);
    pulseUntil = Date.now() + 2600;
    setMsg(nom + " vient de tirer sur le fil. Elle pense à toi, là, maintenant. 🤍");
    setTimeout(renderEtat, 3200);
  }

  function tirer(){
    var moi = role(); if(!moi || !canal || !souscrit) return;
    vibrer([30,50,30]);
    pulseUntil = Date.now() + 2000;
    try{ canal.send({ type:"broadcast", event:"tir-fil", payload:{ de:moi, at:Date.now() } }); }catch(e){}
    setMsg("Tu as tiré sur le fil. Une petite vibration part vers " + NOMS[AUTRE[moi]] + "…");
    btn.disabled=true; setTimeout(function(){ renderEtat(); }, 2400);
  }
  btn.addEventListener("click", tirer);

  chooser.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("[data-r]") : null; if(!b) return;
    try{ localStorage.setItem("moi_role", b.getAttribute("data-r")); }catch(e2){}
    majIdentite(); demarrer();
  });
  changer.addEventListener("click", function(e){ e.preventDefault(); try{ if(canal) canal.untrack(); }catch(e2){} try{ localStorage.removeItem("moi_role"); }catch(e2){} souscrit=false; autrePresent=false; majIdentite(); });

  majIdentite();
  if(role()) demarrer();

  document.addEventListener("visibilitychange", function(){
    if(!document.hidden && role() && canal){ try{ canal.track({ role:role(), page:"/fil", at:Date.now() }); }catch(e){} }
  });
  window.addEventListener("beforeunload", function(){ try{ if(canal) canal.untrack(); }catch(e){} });

  // ---------- le fil (canvas) ----------
  (function(){
    var c=$("fil-canvas"), x=c.getContext("2d"), W,H,DPR;
    function rz(){ DPR=Math.min(2, window.devicePixelRatio||1); W=c.width=innerWidth*DPR; H=c.height=innerHeight*DPR; c.style.width=innerWidth+"px"; c.style.height=innerHeight+"px"; }
    addEventListener("resize", rz); rz();
    var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches, t=0;
    function frame(){
      requestAnimationFrame(frame); if(document.hidden) return;
      t += reduce ? 0.004 : 0.016;
      x.clearRect(0,0,W,H);
      var cx=W/2, top=H*0.12, bot=H*0.88;
      var moi = role();
      var lit = souscrit && autrePresent;
      var pulsing = Date.now() < pulseUntil;
      // intensité globale
      var base = moi ? (lit ? 1 : 0.32) : 0.16;
      if(pulsing) base = 1;
      // onde qui parcourt le fil
      var seg=60;
      x.lineWidth = (lit?2.4:1.4)*DPR;
      for(var pass=0; pass<(lit?2:1); pass++){
        x.beginPath();
        for(var i=0;i<=seg;i++){
          var p=i/seg, y=top+(bot-top)*p;
          var amp = (reduce?6:16)*DPR*(lit?1:0.5)*(pulsing?2.2:1);
          var xx = cx + Math.sin(p*6.28*1.4 + t*(pass?-1.6:1.8)) * amp * Math.sin(p*3.14);
          if(i===0) x.moveTo(xx,y); else x.lineTo(xx,y);
        }
        var g=x.createLinearGradient(0,top,0,bot);
        var a1 = base*(pass?0.5:0.9);
        g.addColorStop(0,   "rgba(199,178,230,"+(a1*0.9)+")");
        g.addColorStop(0.5, "rgba("+(lit?"142,231,160":"180,155,218")+","+a1+")");
        g.addColorStop(1,   "rgba(203,180,236,"+(a1*0.9)+")");
        x.strokeStyle=g; x.shadowColor = lit? "rgba(142,231,160,.7)":"rgba(180,155,218,.6)"; x.shadowBlur=(lit?18:10)*DPR*(pulsing?1.8:1);
        x.stroke();
      }
      x.shadowBlur=0;
      // deux ancres
      function ancre(y, on){
        x.beginPath(); x.arc(cx,y,(on?7:5)*DPR,0,6.28);
        x.fillStyle = on ? "rgba(142,231,160,.95)" : "rgba(199,178,230,.85)";
        x.shadowColor = on ? "rgba(142,231,160,.9)":"rgba(199,178,230,.7)"; x.shadowBlur=16*DPR; x.fill(); x.shadowBlur=0;
      }
      // mon ancre (bas) s'allume si j'ai une identité ; celle du haut si l'autre est là
      ancre(bot, !!moi);
      ancre(top, souscrit && autrePresent);
    }
    frame();
  })();
})();
</script>
<script src="/presence.js" defer></script>
</body>
</html>
