<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#080711" />
<title>Bonne nuit</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; color:#EDE9F3; font-family:'Nunito Sans',system-ui,sans-serif;
    background:
      radial-gradient(120% 90% at 50% -10%, #1a1638 0%, transparent 55%),
      radial-gradient(90% 70% at 50% 115%, #12142f 0%, transparent 60%),
      #0b0a16; overflow-x:hidden; transition:background 1.6s ease; }
  body.dodo{ background:#050409; }
  a.retour{ position:fixed; top:calc(12px + env(safe-area-inset-top)); left:14px; z-index:6; font-size:.9rem; color:rgba(237,233,243,.72); text-decoration:none;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:100px; padding:7px 14px; transition:opacity 1s; }
  body.dodo a.retour{ opacity:.4; }
  a.retour:hover{ color:#fff; }
  #ciel{ position:fixed; inset:0; z-index:0; opacity:.5; transition:opacity 1.6s ease; }
  body.dodo #ciel{ opacity:1; }
  .wrap{ position:relative; z-index:1; max-width:520px; margin:0 auto; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    padding:max(64px,env(safe-area-inset-top)) 22px calc(34px + env(safe-area-inset-bottom)); }
  .eyebrow{ font-family:'Fraunces',serif; font-style:italic; color:#C7B2E6; font-size:1.08rem; margin:0 0 .35rem; }
  h1{ font-family:'Fraunces',serif; font-weight:500; font-size:clamp(2rem,7vw,2.7rem); margin:0 0 .1rem; color:#FBF4EA; }
  .lune{ font-size:4rem; margin:16px 0 4px; filter:drop-shadow(0 0 24px rgba(199,178,230,.6)); animation:flotte 6s ease-in-out infinite; }
  @keyframes flotte{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-8px);} }
  .msg{ font-family:'Fraunces',serif; font-style:italic; color:#E9DEF7; font-size:1.14rem; line-height:1.6; margin:14px auto 0; max-width:31ch; min-height:3em; transition:opacity .5s; }

  .champ{ margin-top:16px; width:100%; max-width:340px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.16); border-radius:100px; color:#EDE9F3; padding:12px 18px; font-family:inherit; font-size:.98rem; text-align:center; }
  .champ:focus{ outline:2px solid #A886DA; }
  .btn{ margin-top:18px; font-family:'Nunito Sans',sans-serif; font-weight:700; font-size:1.02rem; border-radius:100px; padding:15px 30px; cursor:pointer; border:1px solid transparent;
    color:#1a1430; background:linear-gradient(135deg,#CBB4EC,#A886DA); box-shadow:0 14px 32px -14px rgba(168,134,218,.8); transition:transform .18s ease, box-shadow .3s, opacity .3s; }
  .btn:hover{ transform:translateY(-2px); }
  .btn:disabled{ opacity:.5; cursor:default; transform:none; }
  .sien{ margin-top:20px; width:100%; max-width:360px; background:linear-gradient(180deg, rgba(180,155,218,.16), rgba(180,155,218,.05)); border:1px solid rgba(180,155,218,.4); border-radius:18px; padding:16px 18px; }
  .sien .qui{ font-family:'Fraunces',serif; font-weight:500; color:#FBF4EA; font-size:1.02rem; }
  .sien .mot{ font-family:'Fraunces',serif; font-style:italic; color:#E9DEF7; margin-top:6px; line-height:1.5; }
  .sous{ margin-top:16px; color:rgba(201,193,216,.7); font-size:.82rem; max-width:32ch; line-height:1.5; }
  .chooser{ margin-top:18px; display:flex; gap:10px; justify-content:center; }
  .chooser button{ font-family:inherit; font-weight:700; font-size:.95rem; border-radius:100px; padding:11px 18px; cursor:pointer; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.06); color:#EDE9F3; }
  .chooser button.p{ color:#1a1430; background:linear-gradient(135deg,#CBB4EC,#A886DA); border-color:transparent; }
  .changer{ display:inline-block; margin-top:16px; font-size:.82rem; color:#B49BDA; text-decoration:none; opacity:.75; }
</style>
</head>
<body>
  <a class="retour" href="/">⌂ Accueil</a>
  <canvas id="ciel" aria-hidden="true"></canvas>
  <div class="wrap">
    <p class="eyebrow">le rituel du soir, à nous</p>
    <h1>Bonne nuit</h1>
    <div class="lune" id="lune">🌙</div>

    <p class="msg" id="msg">Quand tu es prête à dormir, dis-le. Je passerai la nuit à veiller sur toi, même de loin.</p>

    <div id="sien" class="sien" hidden style="display:none">
      <div class="qui" id="sien-qui"></div>
      <div class="mot" id="sien-mot"></div>
    </div>

    <div id="zone-action">
      <input type="text" id="mot" class="champ" maxlength="140" placeholder="un mot pour la nuit (facultatif)" />
      <div><button class="btn" id="dormir">Je vais dormir 🌙</button></div>
    </div>

    <div class="chooser" id="chooser" hidden style="display:none">
      <button class="p" data-r="lui">Je suis Mathieu</button>
      <button data-r="elle">Je suis dadoucherie</button>
    </div>

    <a href="#" class="changer" id="changer" hidden style="display:none">ce n'est pas toi ? changer</a>
    <p class="sous">Ton « bonne nuit » arrive à l'autre comme un mot doux, et fait glisser cet espace en nuit profonde jusqu'au matin.</p>
  </div>

<script>
(function(){
  "use strict";
  var URL_SB = "https://jnqyjpgbmjclxbjxbnft.supabase.co";
  var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpucXlqcGdibWpjbHhianhibmZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTg0ODIsImV4cCI6MjA5MjYzNDQ4Mn0.zr0iYxqubZwH34Lj61QGo4yS7ScldKNVxrK7rnMw9E8";
  var NOMS = { elle:"dadoucherie", lui:"Mathieu" };
  var AUTRE = { elle:"lui", lui:"elle" };
  function hdrs(extra){ var h={ "apikey":ANON, "Authorization":"Bearer "+ANON, "Content-Type":"application/json" }; for(var k in (extra||{})) h[k]=extra[k]; return h; }
  function role(){ try{ var r=localStorage.getItem("moi_role"); return (r==="elle"||r==="lui")?r:null; }catch(e){ return null; } }
  function vibrer(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
  var $ = function(id){ return document.getElementById(id); };
  // jour "logique" en Europe/Paris pour que les deux téléphones tombent d'accord
  function jour(){
    try{ var f=new Intl.DateTimeFormat("fr-CA",{ timeZone:"Europe/Paris", year:"numeric", month:"2-digit", day:"2-digit" }); return f.format(new Date()); }
    catch(e){ var d=new Date(), m=d.getMonth()+1, j=d.getDate(); return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(j<10?"0":"")+j; }
  }
  var msg=$("msg"), btn=$("dormir"), champ=$("mot"), chooser=$("chooser"), changer=$("changer"), sien=$("sien");
  function setMsg(t){ msg.style.opacity=0; setTimeout(function(){ msg.textContent=t; msg.style.opacity=1; }, 220); }

  function lire(){ return fetch(URL_SB+"/rest/v1/bonne_nuit?jour=eq."+jour()+"&select=de_role,mot,created_at", { headers:hdrs() }).then(function(r){ return r.json(); }).catch(function(){ return []; }); }
  function dire(mot){ return fetch(URL_SB+"/rest/v1/bonne_nuit?on_conflict=jour,de_role", { method:"POST", headers:hdrs({ "Prefer":"resolution=merge-duplicates,return=minimal" }), body:JSON.stringify({ jour:jour(), de_role:role(), mot:mot||null }) }); }

  function nuitProfonde(){ document.body.classList.add("dodo"); }

  function majIdentite(){
    var moi = role();
    chooser.style.display = moi ? "none" : "flex";
    $("zone-action").style.display = moi ? "" : "none";
    changer.style.display = moi ? "inline-block" : "none";
    if(!moi){ setMsg("Dis-moi qui tu es, et je saurai à qui souhaiter bonne nuit."); sien.style.display="none"; }
  }

  function render(rows){
    rows = rows || [];
    var moi = role(); if(!moi){ majIdentite(); return; }
    var autre = AUTRE[moi];
    var moiRow = rows.find(function(r){ return r.de_role===moi; });
    var autreRow = rows.find(function(r){ return r.de_role===autre; });

    // le mot de l'autre pour ce soir
    if(autreRow){
      sien.style.display="block"; sien.hidden=false;
      $("sien-qui").textContent = NOMS[autre] + " t'a souhaité bonne nuit 🌙";
      $("sien-mot").textContent = autreRow.mot ? ("« "+autreRow.mot+" »") : "Dors bien. Je pense à toi jusqu'au matin.";
    } else { sien.style.display="none"; }

    if(moiRow){
      btn.textContent = "Bonne nuit à toi aussi 🤍"; btn.disabled=false;
      champ.style.display="none";
      nuitProfonde();
      if(autreRow) setMsg("Vous vous êtes dit bonne nuit tous les deux. La nuit peut venir. 🤍");
      else setMsg("Tu as dit bonne nuit. Repose-toi, je veille. J'attends le sien avant de m'endormir aussi.");
    } else {
      btn.textContent = "Je vais dormir 🌙"; btn.disabled=false; champ.style.display="";
      if(autreRow) setMsg(NOMS[autre]+" est déjà couché·e et pense à toi. Dis-lui bonne nuit quand tu veux.");
    }
  }
  function refresh(){ return lire().then(render); }

  function faireDormir(){
    var moi = role(); if(!moi) return;
    btn.disabled=true;
    var t=(champ.value||"").trim();
    nuitProfonde(); vibrer(30);
    dire(t).then(function(){ champ.value=""; setMsg("Bonne nuit, toi. 🌙 J'ai prévenu "+NOMS[AUTRE[moi]]+"."); setTimeout(refresh, 700); })
      .catch(function(){ btn.disabled=false; });
  }
  btn.addEventListener("click", faireDormir);
  champ.addEventListener("keydown", function(e){ if(e.key==="Enter") faireDormir(); });

  chooser.addEventListener("click", function(e){ var b=e.target.closest?e.target.closest("[data-r]"):null; if(!b)return; try{ localStorage.setItem("moi_role", b.getAttribute("data-r")); }catch(e2){} majIdentite(); refresh(); demarrerRealtime(); });
  changer.addEventListener("click", function(e){ e.preventDefault(); try{ localStorage.removeItem("moi_role"); }catch(e2){} document.body.classList.remove("dodo"); majIdentite(); });

  majIdentite();
  refresh();
  setInterval(refresh, 8000);

  // ---- temps réel ----
  var client=null, canal=null;
  function demarrerRealtime(){
    if(!role()) return;
    if(window.supabase && window.supabase.createClient) return brancher();
    var s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"; s.onload=brancher; s.onerror=function(){}; document.head.appendChild(s);
  }
  function brancher(){ try{ if(!window.supabase||!window.supabase.createClient)return; if(!client) client=window.supabase.createClient(URL_SB, ANON); if(canal) return; canal=client.channel("bonne-nuit-live"); canal.on("postgres_changes",{ event:"*", schema:"public", table:"bonne_nuit" }, function(){ refresh(); }); canal.subscribe(); }catch(e){} }
  demarrerRealtime();

  // ---- ciel étoilé ----
  (function(){
    var c=$("ciel"), x=c.getContext("2d"), W,H,st=[];
    function rz(){ W=c.width=innerWidth; H=c.height=innerHeight; st=[]; var n=Math.min(140, Math.round(W*H/14000)); for(var i=0;i<n;i++) st.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.2,p:Math.random()*6.28,v:Math.random()*1.1+.3}); }
    addEventListener("resize", rz); rz();
    var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches, t=0;
    function frame(){ requestAnimationFrame(frame); if(document.hidden) return; t+=0.014; x.clearRect(0,0,W,H);
      for(var i=0;i<st.length;i++){ var s=st[i]; var a=reduce?0.7:(0.35+0.5*Math.sin(t*s.v+s.p)); x.globalAlpha=a; x.fillStyle="#e9e2f7"; x.beginPath(); x.arc(s.x,s.y,s.r,0,6.28); x.fill(); }
      x.globalAlpha=1;
    }
    frame();
  })();
})();
</script>
<script src="/presence.js" defer></script>
</body>
</html>
