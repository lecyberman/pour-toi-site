<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0b0a16" />
<title>Nos retrouvailles</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; color:#EDE9F3; font-family:'Nunito Sans',system-ui,sans-serif;
    background:
      radial-gradient(120% 90% at 50% -10%, #241d40 0%, transparent 55%),
      radial-gradient(90% 70% at 50% 115%, #17152f 0%, transparent 60%),
      #0b0a16; overflow-x:hidden; }
  a.retour{ position:fixed; top:calc(12px + env(safe-area-inset-top)); left:14px; z-index:3; font-size:.9rem; color:rgba(237,233,243,.72); text-decoration:none;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:100px; padding:7px 14px; }
  a.retour:hover{ color:#fff; }
  .wrap{ max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    padding:max(64px,env(safe-area-inset-top)) 22px calc(40px + env(safe-area-inset-bottom)); }
  .eyebrow{ font-family:'Fraunces',serif; font-style:italic; color:#C7B2E6; font-size:1.08rem; margin:0 0 .35rem; }
  h1{ font-family:'Fraunces',serif; font-weight:500; font-size:clamp(2rem,7vw,2.7rem); margin:0 0 .1rem; color:#FBF4EA; }
  .lieu{ color:#B49BDA; font-family:'Fraunces',serif; font-style:italic; font-size:1.05rem; margin:.3rem 0 0; min-height:1.2em; }

  .compte{ display:flex; gap:10px; justify-content:center; margin:28px 0 6px; flex-wrap:wrap; }
  .bloc{ background:rgba(255,255,255,.05); border:1px solid rgba(180,155,218,.26); border-radius:16px; padding:14px 10px; min-width:74px; }
  .bloc .n{ font-family:'Fraunces',serif; font-weight:600; font-size:2rem; color:#F1ECF8; line-height:1; }
  .bloc .l{ font-size:.72rem; color:rgba(201,193,216,.75); margin-top:6px; text-transform:uppercase; letter-spacing:.08em; }

  .mot{ font-family:'Fraunces',serif; font-style:italic; color:#E9DEF7; font-size:1.16rem; line-height:1.7; max-width:32ch; margin:20px auto 0; min-height:3.4em; }
  .vide{ color:#A99CC4; font-size:1rem; line-height:1.7; max-width:32ch; margin:10px auto 0; }

  /* réglage (Mathieu seulement) */
  .reglage{ margin-top:26px; width:100%; max-width:360px; background:rgba(255,255,255,.04); border:1px solid rgba(180,155,218,.2); border-radius:16px; padding:16px; display:none; }
  .reglage.on{ display:block; }
  .reglage h2{ font-family:'Fraunces',serif; font-weight:500; font-size:1.05rem; margin:0 0 12px; color:#FBF4EA; }
  .reglage label{ display:block; text-align:left; font-size:.82rem; color:#B7ACCB; margin:10px 0 4px; }
  .reglage input{ width:100%; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.16); border-radius:12px; color:#EDE9F3; padding:11px 12px; font-family:inherit; font-size:.95rem; }
  .reglage input:focus{ outline:2px solid #A886DA; }
  .reglage button{ margin-top:14px; width:100%; font-family:inherit; font-weight:700; font-size:.95rem; color:#1a1430; background:linear-gradient(135deg,#CBB4EC,#A886DA); border:none; border-radius:100px; padding:12px; cursor:pointer; }
  .reglage .ok{ color:#8ee6a0; font-size:.82rem; margin-top:10px; min-height:1em; }
  .adminlink{ display:inline-block; margin-top:18px; font-size:.8rem; color:#B49BDA; opacity:.7; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <a class="retour" href="/">⌂ Accueil</a>
  <div class="wrap">
    <p class="eyebrow">le prochain moment tout contre toi</p>
    <h1>Nos retrouvailles</h1>
    <p class="lieu" id="lieu"></p>

    <div class="compte" id="compte" hidden>
      <div class="bloc"><div class="n" id="j">0</div><div class="l">jours</div></div>
      <div class="bloc"><div class="n" id="h">0</div><div class="l">heures</div></div>
      <div class="bloc"><div class="n" id="m">0</div><div class="l">minutes</div></div>
      <div class="bloc"><div class="n" id="s">0</div><div class="l">secondes</div></div>
    </div>

    <p class="mot" id="mot"></p>
    <p class="vide" id="vide" hidden>Aucune date n'est encore posée. Bientôt, promis, je nous en fixe une.</p>

    <div class="reglage" id="reglage">
      <h2>Régler notre date 🤍</h2>
      <label for="in-date">La date où on se retrouve</label>
      <input type="date" id="in-date" />
      <label for="in-lieu">Où (facultatif)</label>
      <input type="text" id="in-lieu" placeholder="ex : chez toi, à la gare, dans le sud…" />
      <button id="save">Enregistrer</button>
      <p class="ok" id="okmsg"></p>
    </div>
    <a class="adminlink" id="toggle-reglage" hidden>régler la date</a>
  </div>

<script>
(function(){
  "use strict";
  var URL_SB = "https://jnqyjpgbmjclxbjxbnft.supabase.co";
  var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpucXlqcGdibWpjbHhianhibmZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTg0ODIsImV4cCI6MjA5MjYzNDQ4Mn0.zr0iYxqubZwH34Lj61QGo4yS7ScldKNVxrK7rnMw9E8";
  function hdrs(extra){ var h={ "apikey":ANON, "Authorization":"Bearer "+ANON, "Content-Type":"application/json" }; for(var k in (extra||{})) h[k]=extra[k]; return h; }
  function role(){ try{ var r=localStorage.getItem("moi_role"); return (r==="elle"||r==="lui")?r:null; }catch(e){ return null; } }
  function $(id){ return document.getElementById(id); }

  var cible = null, lieu = null, tick = null;

  function lire(){
    return fetch(URL_SB+"/rest/v1/retrouvailles?id=eq.1&select=date_cible,lieu", { headers:hdrs() })
      .then(function(r){ return r.json(); })
      .then(function(rows){ return (rows && rows[0]) ? rows[0] : null; })
      .catch(function(){ return null; });
  }
  function enregistrer(dateStr, lieuStr){
    return fetch(URL_SB+"/rest/v1/retrouvailles?id=eq.1", {
      method:"PATCH",
      headers:hdrs({ "Prefer":"return=minimal" }),
      body: JSON.stringify({ date_cible: dateStr || null, lieu: lieuStr || null, updated_at: new Date().toISOString() })
    });
  }

  function motPour(jours){
    if(jours <= 0) return "C'est aujourd'hui. Va te préparer, j'arrive te serrer fort. 🤍";
    if(jours === 1) return "Demain. Demain, je te retrouve. Je n'ai jamais aussi bien dormi qu'avant un jour pareil.";
    if(jours <= 7) return "Plus que quelques jours. Je compte les heures comme un gamin avant Noël.";
    if(jours <= 30) return "On y est presque. Chaque jour qui passe est un jour de moins à être loin de toi.";
    return "C'est encore un peu loin, mais c'est écrit maintenant. Et tout ce qui est écrit avec toi finit par arriver.";
  }

  function majCompte(){
    if(!cible){ return; }
    var maintenant = new Date();
    var diff = cible.getTime() - maintenant.getTime();
    if(diff < 0) diff = 0;
    var sec = Math.floor(diff/1000);
    var j = Math.floor(sec/86400); sec -= j*86400;
    var h = Math.floor(sec/3600); sec -= h*3600;
    var m = Math.floor(sec/60); sec -= m*60;
    $("j").textContent = j; $("h").textContent = h; $("m").textContent = m; $("s").textContent = sec;
  }

  function afficher(row){
    // réglage visible seulement pour Mathieu
    if(role() === "lui"){ $("toggle-reglage").hidden = false; }

    if(!row || !row.date_cible){
      $("compte").hidden = true; $("mot").textContent = ""; $("vide").hidden = false; $("lieu").textContent = "";
      if(role() === "lui"){ $("vide").textContent = "Aucune date posée pour l'instant. Règle-la ci-dessous 🤍"; }
      return;
    }
    $("vide").hidden = true;
    lieu = row.lieu || null;
    $("lieu").textContent = lieu ? ("à " + lieu) : "";
    // date à midi local pour éviter les décalages de fuseau
    cible = new Date(row.date_cible + "T12:00:00");
    var joursRest = Math.ceil((cible.getTime() - Date.now())/86400000);
    $("mot").textContent = motPour(joursRest);
    $("compte").hidden = false;
    majCompte();
    if(tick) clearInterval(tick);
    tick = setInterval(majCompte, 1000);
    // pré-remplir le réglage
    try{ $("in-date").value = row.date_cible; if(lieu) $("in-lieu").value = lieu; }catch(e){}
  }

  function charger(){ lire().then(afficher); }
  charger();

  // réglage
  $("toggle-reglage").addEventListener("click", function(){ $("reglage").classList.toggle("on"); });
  $("save").addEventListener("click", function(){
    var d = $("in-date").value, l = $("in-lieu").value.trim();
    if(!d){ $("okmsg").style.color="#e6a6a6"; $("okmsg").textContent = "Choisis une date d'abord."; return; }
    $("save").disabled = true; $("okmsg").style.color="#8ee6a0"; $("okmsg").textContent = "…";
    enregistrer(d, l).then(function(){ $("okmsg").textContent = "C'est noté 🤍"; $("save").disabled=false; charger(); })
      .catch(function(){ $("okmsg").style.color="#e6a6a6"; $("okmsg").textContent = "Oups, réessaie."; $("save").disabled=false; });
  });
})();
</script>
<script src="/presence.js" defer></script>
</body>
</html>
