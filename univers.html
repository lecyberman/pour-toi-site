<style>
  :root{
    --display:'Fraunces', Georgia, serif; --body:'Nunito Sans', system-ui, sans-serif;
    --or:#B49BDA; --corail:#E1806F;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{ font-family:var(--body); background:#0A0E22; color:#EDE9F3; overflow:hidden; }
  #ciel{ position:fixed; inset:0; width:100vw; height:100vh; display:block; z-index:1; touch-action:manipulation; }

  .tete{
    position:fixed; top:0; left:0; right:0; z-index:3; text-align:center;
    padding:26px 20px 40px; pointer-events:none;
    background:linear-gradient(180deg, rgba(10,14,34,.7), transparent);
  }
  .tete .eyebrow{ font-weight:700; font-size:.72rem; letter-spacing:.2em; text-transform:uppercase; color:var(--or); }
  .tete h1{ font-family:var(--display); font-weight:500; font-size:clamp(1.8rem,6vw,2.6rem); margin:.35rem 0 .3rem; text-shadow:0 2px 30px rgba(0,0,0,.6); }
  .tete p{ color:#B9AECB; font-size:.95rem; max-width:40ch; margin:0 auto; }

  .indice{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:3;
    font-size:.82rem; color:#B9AECB; pointer-events:none; text-align:center;
    animation:pulse 3s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:.7;} 50%{opacity:.35;} }

  .carte{
    position:fixed; left:50%; bottom:70px; transform:translateX(-50%) translateY(14px);
    z-index:4; width:calc(100vw - 40px); max-width:420px;
    background:rgba(16,20,44,.9); border:1px solid rgba(232,193,92,.35); border-radius:18px;
    padding:20px 22px; backdrop-filter:blur(8px);
    opacity:0; pointer-events:none; transition:opacity .5s ease, transform .5s ease;
  }
  .carte.on{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  .carte .quand{ font-family:var(--display); font-style:italic; color:var(--or); font-size:1.15rem; margin-bottom:6px; }
  .carte .txt{ font-size:1.02rem; line-height:1.6; color:#EDE9F3; }
  .carte .fermer{ position:absolute; top:10px; right:12px; background:none; border:none; color:#8A82A0; font-size:1.2rem; cursor:pointer; }

  .liens{ position:fixed; top:0; z-index:5; }
  .retour{
    position:fixed; top:16px; left:16px; z-index:5;
    background:rgba(16,20,44,.7); border:1px solid rgba(255,255,255,.12); border-radius:100px;
    color:#EDE9F3; font-family:var(--body); font-weight:600; font-size:.85rem; padding:8px 15px;
    text-decoration:none; backdrop-filter:blur(6px);
  }
  .retour:hover{ color:var(--or); }

  /* accès clavier : liste focusable, hors écran visuellement mais utilisable */
  .sr-list{ position:fixed; left:-9999px; top:0; }
  .sr-list button:focus{ position:fixed; left:16px; top:60px; z-index:6; background:#171B33; color:#fff; border:1px solid var(--or); border-radius:8px; padding:8px 12px; }

  @media (prefers-reduced-motion:reduce){ .indice{ animation:none; } }
</style>
</head>
<body>
<a class="retour" href="/">⌂ accueil</a>
<canvas id="ciel" aria-hidden="true"></canvas>

<div class="tete">
  <p class="eyebrow">la carte de nous</p>
  <h1>Notre univers</h1>
  <p>Chaque étoile dorée est un moment de nous. Touche-les.</p>
</div>

<div class="carte" id="carte" role="dialog" aria-live="polite">
  <button class="fermer" id="fermer" aria-label="Fermer">✕</button>
  <div class="quand" id="carteTitre"></div>
  <div class="txt" id="carteTxt"></div>
</div>

<nav class="sr-list" id="srList" aria-label="Les étoiles de notre histoire"></nav>
<p class="indice" id="indice">touche une étoile</p>

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2); W=window.innerWidth; H=window.innerHeight;
    cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize); resize();
  function rnd(a,b){return a+Math.random()*(b-a);}

  // Les jalons = étoiles nommées (x,y en fraction d'écran)
  var C = [
    {x:.22,y:.34,nom:"L'ajout Snap",       txt:"Il y a sept ans, une notification. La toute première étoile, celle qui a tout déclenché. On ne savait pas encore qu'on dessinait une constellation."},
    {x:.33,y:.26,nom:"Lyon, 1er janvier 2020", txt:"La première fois que je t'ai vue en vrai. Premier jour de l'année, première certitude de ma vie. J'ai su, sans effet spécial, sans prévenir."},
    {x:.45,y:.33,nom:"Notre nuit, 15 juillet 2023", txt:"On a parlé jusqu'au lever du soleil. C'est cette nuit-là que « toi et moi » est devenu « nous »."},
    {x:.57,y:.24,nom:"Monaco",             txt:"Les yachts, les lumières, et tes yeux qui brillaient un peu plus fort que d'habitude. Je note tout, tu sais."},
    {x:.66,y:.32,nom:"Malte",              txt:"La lumière sur l'eau, et toi qui prends la même photo quinze fois. Moi qui te regarde, toi."},
    {x:.74,y:.22,nom:"Barcelone",          txt:"Les soirées qui ne voulaient pas finir, parce qu'on ne voulait pas qu'elles finissent."},
    {x:.83,y:.30,nom:"Le oui",             txt:"Juillet 2026. Je n'en dis pas plus, même aux étoiles. Elles ont vu, de toute façon."},
    {x:.90,y:.20,nom:"La suite",           txt:"Cette étoile n'a pas encore de nom. C'est la place de tout ce qui nous reste à vivre. On la nommera ensemble.", ouverte:true}
  ];

  // étoiles de fond (profondeurs multiples)
  var fond=[];
  for(var i=0;i<380;i++) fond.push({x:Math.random(),y:Math.random(),r:rnd(.3,1.6),tw:rnd(0,6.3),v:rnd(.4,1.4),c:Math.random()<.3?2:1});

  var vl=document.createElement('canvas');
  function peindreVL(){
    vl.width=W; vl.height=H; var c=vl.getContext('2d'); c.clearRect(0,0,W,H);
    for(var i=0;i<700;i++){ var t=i/700; var bx=t*W*1.25-W*.1; var by=H*.62-t*H*.36+Math.sin(t*8)*H*.03;

      c.beginPath(); c.arc(x,y,rnd(.3,1),0,6.283);
      c.fillStyle='rgba('+(200+Math.floor(rnd(0,55)))+','+(195+Math.floor(rnd(0,40)))+',255,'+rnd(.02,.12)+')'; c.fill(); }

    ctx.beginPath(); ctx.arc(lx,ly,lr,0,6.283); ctx.fillStyle='#EDEAF6'; ctx.fill();
    ctx.beginPath(); ctx.arc(lx+14,ly-6,lr,0,6.283); ctx.fillStyle='#0E1330'; ctx.globalAlpha=.55; ctx.fill(); ctx.globalAlpha=1;

      ctx.fillText(C[i].nom.split(',')[0], p.x, p.y-20);

  }

  var carte=document.getElementById('carte'), carteTitre=document.getElementById('carteTitre'), carteTxt=document.getElementById('carteTxt');
  var indice=document.getElementById('indice'); var selection=null;
  function ouvrir(s){ selection=s; carteTitre.textContent=s.nom; carteTxt.textContent=s.txt; carte.classList.add('on'); indice.style.display='none'; }
  function fermer(){ selection=null; carte.classList.remove('on'); }
  document.getElementById('fermer').addEventListener('click', fermer);
  function toucher(cx,cy){ for(var i=0;i<C.length;i++){ var p=pos(C[i]); var dx=cx-p.x,dy=cy-p.y; if(dx*dx+dy*dy<30*30){ ouvrir(C[i]); return true; } } return false; }
  cv.addEventListener('click',function(e){ if(!toucher(e.clientX,e.clientY)) fermer(); });

  // accès clavier : boutons focusables
  var srList=document.getElementById('srList');
  C.forEach(function(s){ var b=document.createElement('button'); b.textContent=s.nom; b.addEventListener('click',function(){ ouvrir(s); }); srList.appendChild(b); });

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

    // étoiles nommées
    for(var i=0;i<C.length;i++){ var p=pos(C[i]); var puls=reduce?1:(.75+.25*Math.sin(t*1.6+i));
      var halo=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,16);
      halo.addColorStop(0,'rgba(232,193,92,.85)'); halo.addColorStop(1,'rgba(232,193,92,0)');
      ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(p.x,p.y,16,0,6.283); ctx.fill();
      ctx.beginPath(); ctx.arc(p.x,p.y,(C[i].ouverte?2.2:3)*puls,0,6.283);
      ctx.fillStyle=C[i]===selection?'#FFF':'rgba(255,240,210,.95)'; ctx.fill();
      // label discret
      ctx.font='600 11px Nunito Sans, sans-serif'; ctx.textAlign='center'; ctx.fillStyle='rgba(237,233,243,.7)';
      ctx.fillText(C[i].nom.split(',')[0], p.x, p.y-20);
    }
    // comète
    if(comete){ var f=comete; var grd=ctx.createLinearGradient(f.x,f.y,f.x-f.vx*10,f.y-f.vy*10);
      grd.addColorStop(0,'rgba(255,255,255,'+(.9*f.vie)+')'); grd.addColorStop(1,'rgba(255,255,255,0)');
      ctx.strokeStyle=grd; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(f.x,f.y); ctx.lineTo(f.x-f.vx*10,f.y-f.vy*10); ctx.stroke();
      f.x+=f.vx; f.y+=f.vy; f.vie-=.014; if(f.vie<=0||f.x>W+80) comete=null; }
  }
  function pos(s){ return { x:s.x*W+(mx-.5)*-6, y:s.y*H+(my-.5)*-4 }; }

  // Interaction
  var carte=document.getElementById('carte'), carteTitre=document.getElementById('carteTitre'), carteTxt=document.getElementById('carteTxt');
  var indice=document.getElementById('indice'); var selection=null;
  function ouvrir(s){ selection=s; carteTitre.textContent=s.nom; carteTxt.textContent=s.txt; carte.classList.add('on'); indice.style.display='none'; }
  function fermer(){ selection=null; carte.classList.remove('on'); }
  document.getElementById('fermer').addEventListener('click', fermer);
  function toucher(cx,cy){ for(var i=0;i<C.length;i++){ var p=pos(C[i]); var dx=cx-p.x,dy=cy-p.y; if(dx*dx+dy*dy<30*30){ ouvrir(C[i]); return true; } } return false; }
  cv.addEventListener('click',function(e){ if(!toucher(e.clientX,e.clientY)) fermer(); });

  // accès clavier : boutons focusables
  var srList=document.getElementById('srList');
  C.forEach(function(s){ var b=document.createElement('button'); b.textContent=s.nom; b.addEventListener('click',function(){ ouvrir(s); }); srList.appendChild(b); });

  requestAnimationFrame(frame);
})();
</script>
