<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0d0b1a" />
<title>Notre univers</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#0d0b1a; color:#EDE9F3; font-family:'Nunito Sans',system-ui,sans-serif; overflow:hidden; }
  #scene{ position:fixed; inset:0; width:100vw; height:100vh; display:block; z-index:0; touch-action:none; cursor:grab; }
  #scene:active{ cursor:grabbing; }

  .ui{ position:fixed; z-index:2; pointer-events:none; }
  .tete{ top:max(20px,env(safe-area-inset-top)); left:0; right:0; text-align:center; padding:0 20px; }
  .tete .eyebrow{ font-family:'Fraunces',serif; font-style:italic; color:#B49BDA; font-size:1.05rem; margin:0 0 .2rem; text-shadow:0 2px 18px rgba(0,0,0,.6); }
  .tete h1{ font-family:'Fraunces',serif; font-weight:500; font-size:clamp(1.7rem,5.5vw,2.6rem); margin:0; color:#FBF4EA; letter-spacing:-.01em; text-shadow:0 4px 30px rgba(0,0,0,.6); }
  .indice{ bottom:max(18px,env(safe-area-inset-bottom)); left:0; right:0; text-align:center; font-size:.82rem; color:rgba(237,233,243,.55); padding:0 20px; }

  /* carte souvenir */
  #carte{ position:fixed; z-index:4; left:50%; top:50%; transform:translate(-50%,-46%) scale(.96); width:min(92vw,440px);
    background:rgba(24,22,46,.82); border:1px solid rgba(180,155,218,.35); border-radius:20px; padding:26px 24px 22px;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow:0 30px 80px -30px rgba(0,0,0,.8);
    opacity:0; visibility:hidden; transition:opacity .45s ease, transform .45s cubic-bezier(.22,.61,.36,1); pointer-events:none; }
  #carte.on{ opacity:1; visibility:visible; transform:translate(-50%,-50%) scale(1); pointer-events:auto; }
  #carte .num{ font-family:'Fraunces',serif; font-style:italic; color:#B49BDA; font-size:.85rem; letter-spacing:.08em; }
  #carte h2{ font-family:'Fraunces',serif; font-weight:500; font-size:1.5rem; margin:.25rem 0 .6rem; color:#FBF4EA; line-height:1.2; }
  #carte p{ font-size:1rem; line-height:1.7; color:#D8D2E4; margin:0; }
  #carte .fermer{ margin-top:18px; font-family:'Nunito Sans',sans-serif; font-weight:700; font-size:.92rem; color:#EDE9F3;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); border-radius:100px; padding:9px 20px; cursor:pointer; transition:background .25s; }
  #carte .fermer:hover{ background:rgba(255,255,255,.16); }

  /* liste accessible (clavier / repli) */
  .liens{ position:fixed; z-index:3; top:max(16px,env(safe-area-inset-top)); left:16px; }
  .liens a{ font-size:.9rem; color:rgba(237,233,243,.7); text-decoration:none; background:rgba(24,22,46,.55); border:1px solid rgba(255,255,255,.12);
    border-radius:100px; padding:7px 14px; pointer-events:auto; backdrop-filter:blur(8px); }
  .liens a:hover{ color:#fff; }

  .sr-list{ position:fixed; z-index:3; right:16px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:6px; max-width:42vw; }
  .sr-list button{ pointer-events:auto; text-align:right; font-family:'Nunito Sans',sans-serif; font-size:.82rem; color:rgba(237,233,243,.55);
    background:none; border:none; cursor:pointer; padding:3px 2px; transition:color .2s; }
  .sr-list button:hover, .sr-list button:focus-visible{ color:#C7B2E6; outline:none; }
  @media (max-width:640px){ .sr-list{ display:none; } }

  /* repli sans WebGL */
  #fallback{ position:fixed; inset:0; z-index:5; display:none; overflow:auto; padding:70px 20px 40px;
    background:radial-gradient(120% 80% at 50% -10%, #241d3f 0%, transparent 55%), #0d0b1a; }
  #fallback.on{ display:block; }
  #fallback .in{ max-width:560px; margin:0 auto; }
  #fallback .f-item{ background:rgba(255,255,255,.05); border-left:3px solid #B49BDA; border-radius:14px; padding:15px 18px; margin-bottom:12px; }
  #fallback .f-item h3{ font-family:'Fraunces',serif; font-weight:500; margin:0 0 4px; color:#FBF4EA; }
  #fallback .f-item p{ margin:0; color:#C9C1D8; line-height:1.6; }

  @media (prefers-reduced-motion:reduce){ #carte{ transition:opacity .2s ease; } }
</style>
</head>
<body>
  <canvas id="scene" aria-label="Constellation de nos moments"></canvas>

  <div class="ui tete">
    <p class="eyebrow">tout ce qui nous relie</p>
    <h1>Notre univers</h1>
  </div>

  <nav class="liens"><a href="/">⌂ Accueil</a></nav>
  <div class="sr-list" id="srList" aria-label="Nos moments"></div>

  <div class="ui indice" id="indice">Fais tourner du doigt · touche une étoile pour lire</div>

  <div id="carte" role="dialog" aria-modal="false" aria-labelledby="carteTitre">
    <div class="num" id="carteNum"></div>
    <h2 id="carteTitre"></h2>
    <p id="carteTxt"></p>
    <button class="fermer" id="carteFermer" type="button">Fermer doucement</button>
  </div>

  <section id="fallback"><div class="in">
    <div class="ui tete" style="position:static; margin-bottom:22px;">
      <p class="eyebrow">tout ce qui nous relie</p>
      <h1>Notre univers</h1>
    </div>
    <div id="fallbackList"></div>
  </div></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  // ===== Nos moments (à personnaliser librement) =====
  var MOMENTS = [
    { nom: "Snapchat, il y a 7 ans", txt: "Là où tout a commencé. Deux inconnus, un message, puis un autre, et une conversation qui n'a jamais vraiment fini." },
    { nom: "Lyon, 1er janvier 2020", txt: "La première fois que je t'ai vue pour de vrai. Le début d'une année, et le début de nous." },
    { nom: "Notre nuit, 15 juillet 2023", txt: "Celle dont on ne parle pas trop fort. Notre ciel, rien qu'à nous, et tout qui bascule doucement." },
    { nom: "Monaco", txt: "Un de nos ailleurs. La mer, la lumière un peu trop belle, et toi au milieu de tout ça." },
    { nom: "Malte", txt: "Une île hors du temps. Comme une parenthèse qu'on aurait ouverte juste pour nous deux." },
    { nom: "Barcelone", txt: "Des rues qui n'en finissent pas, des couchers de soleil, et ta main dans la mienne." },
    { nom: "Ce qu'on construit", txt: "Nos projets, nos idées, nos marques. La preuve qu'on avance ensemble, même quand c'est difficile." },
    { nom: "La suite", txt: "Une étoile encore un peu floue. Mais elle brille déjà, et je sais qu'on va la rejoindre." }
  ];

  var canvas = document.getElementById("scene");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---- Repli si pas de WebGL ----
  function hasWebGL() {
    try { var c = document.createElement("canvas");
      return !!(window.WebGLRenderingContext && (c.getContext("webgl") || c.getContext("experimental-webgl")));
    } catch (e) { return false; }
  }
  if (!hasWebGL() || typeof THREE === "undefined") { return showFallback(); }

  function showFallback() {
    var list = document.getElementById("fallbackList");
    MOMENTS.forEach(function (m) {
      var d = document.createElement("div"); d.className = "f-item";
      var h = document.createElement("h3"); h.textContent = m.nom;
      var p = document.createElement("p"); p.textContent = m.txt;
      d.appendChild(h); d.appendChild(p); list.appendChild(d);
    });
    document.getElementById("fallback").classList.add("on");
    canvas.style.display = "none";
    var ind = document.getElementById("indice"); if (ind) ind.style.display = "none";
  }

  var renderer, scene, camera, group, raycaster, pointer, milestones = [], lineMat;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
  } catch (e) { return showFallback(); }
  renderer.setClearColor(0x0d0b1a, 1);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0d0b1a, 0.0016);
  camera = new THREE.PerspectiveCamera(58, 1, 0.1, 3000);
  camera.position.set(0, 0, 210);
  group = new THREE.Group();
  scene.add(group);

  // ---- texture douce (rond lumineux) ----
  function dot(hex) {
    var c = document.createElement("canvas"); c.width = c.height = 64;
    var x = c.getContext("2d");
    var g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, hex + "ff"); g.addColorStop(0.25, hex + "cc"); g.addColorStop(1, hex + "00");
    x.fillStyle = g; x.fillRect(0, 0, 64, 64);
    var t = new THREE.CanvasTexture(c); return t;
  }
  var texStar = dot("#e9e2f7");
  var texGlow = dot("#c7b2e6");

  // ---- champ d'étoiles lointaines (profondeur) ----
  function starField(count, rmin, rmax, size, color, opacity) {
    var g = new THREE.BufferGeometry();
    var pos = new Float32Array(count * 3);
    for (var i = 0; i < count; i++) {
      var r = rmin + Math.random() * (rmax - rmin);
      var th = Math.acos(2 * Math.random() - 1);
      var ph = Math.random() * Math.PI * 2;
      pos[i * 3] = r * Math.sin(th) * Math.cos(ph);
      pos[i * 3 + 1] = r * Math.sin(th) * Math.sin(ph);
      pos[i * 3 + 2] = r * Math.cos(th);
    }
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    var m = new THREE.PointsMaterial({ size: size, map: texStar, color: new THREE.Color(color),
      transparent: true, opacity: opacity, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true });
    return new THREE.Points(g, m);
  }
  var small = window.innerWidth < 640;
  group.add(starField(small ? 900 : 1700, 300, 1200, 4.5, 0xcfc6e6, 0.7));
  group.add(starField(small ? 260 : 520, 120, 320, 6.5, 0xd9cff0, 0.9));

  // ---- nébuleuse douce au centre ----
  var nebMat = new THREE.SpriteMaterial({ map: texGlow, color: 0x8E6FBF, transparent: true, opacity: 0.22,
    depthWrite: false, blending: THREE.AdditiveBlending });
  var neb = new THREE.Sprite(nebMat); neb.scale.set(360, 360, 1); group.add(neb);

  // ---- positions des moments (répartition régulière type Fibonacci) ----
  function fib(i, n) {
    var off = 2 / n, y = i * off - 1 + off / 2;
    var r = Math.sqrt(1 - y * y), phi = i * Math.PI * (3 - Math.sqrt(5));
    return new THREE.Vector3(Math.cos(phi) * r, y, Math.sin(phi) * r);
  }
  var R = 110;
  MOMENTS.forEach(function (m, i) {
    var p = fib(i, MOMENTS.length).multiplyScalar(R);
    var mat = new THREE.SpriteMaterial({ map: texGlow, color: 0xC7B2E6, transparent: true, opacity: 0.95,
      depthWrite: false, blending: THREE.AdditiveBlending });
    var s = new THREE.Sprite(mat); s.position.copy(p);
    s.scale.set(16, 16, 1);
    s.userData = { i: i, base: 16, nom: m.nom, txt: m.txt };
    group.add(s); milestones.push(s);
  });

  // ---- lignes de la constellation (le fil de notre histoire) ----
  lineMat = new THREE.LineBasicMaterial({ color: 0x8E6FBF, transparent: true, opacity: 0.35 });
  var lg = new THREE.BufferGeometry();
  var lp = [];
  for (var i = 0; i < milestones.length; i++) {
    lp.push(milestones[i].position.x, milestones[i].position.y, milestones[i].position.z);
  }
  lg.setAttribute("position", new THREE.Float32BufferAttribute(lp, 3));
  group.add(new THREE.Line(lg, lineMat));

  raycaster = new THREE.Raycaster();
  pointer = new THREE.Vector2();

  // ===== interaction : rotation au drag + inertie =====
  var rotX = 0.2, rotY = 0, velX = 0, velY = 0, targetRX = 0.2, targetRY = 0;
  var dragging = false, moved = false, lastX = 0, lastY = 0, auto = !reduce;

  function onDown(e) {
    dragging = true; moved = false; auto = false;
    var p = point(e); lastX = p.x; lastY = p.y;
  }
  function onMove(e) {
    if (!dragging) return;
    var p = point(e); var dx = p.x - lastX, dy = p.y - lastY;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    targetRY += dx * 0.005; targetRX += dy * 0.005;
    targetRX = Math.max(-1.2, Math.min(1.2, targetRX));
    lastX = p.x; lastY = p.y;
  }
  function onUp(e) {
    if (dragging && !moved) pick(e);
    dragging = false;
    setTimeout(function () { if (!dragging) auto = !reduce; }, 2600);
  }
  function point(e) { var t = e.touches ? e.touches[0] : e; return { x: t.clientX, y: t.clientY }; }

  canvas.addEventListener("mousedown", onDown);
  window.addEventListener("mousemove", onMove, { passive: true });
  window.addEventListener("mouseup", onUp);
  canvas.addEventListener("touchstart", function (e) { onDown(e); }, { passive: true });
  canvas.addEventListener("touchmove", function (e) { onMove(e); }, { passive: true });
  canvas.addEventListener("touchend", function (e) { onUp(e.changedTouches ? { clientX: e.changedTouches[0].clientX, clientY: e.changedTouches[0].clientY } : e); }, { passive: true });

  function pick(e) {
    var t = e.changedTouches ? e.changedTouches[0] : e;
    var rect = canvas.getBoundingClientRect();
    pointer.x = ((t.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((t.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    raycaster.params.Sprite = { threshold: 0 };
    var hit = raycaster.intersectObjects(milestones, false);
    if (hit.length) ouvrir(hit[0].object.userData);
  }

  // ===== carte souvenir =====
  var carte = document.getElementById("carte");
  var elNum = document.getElementById("carteNum"), elTit = document.getElementById("carteTitre"), elTxt = document.getElementById("carteTxt");
  function ouvrir(d) {
    elNum.textContent = "· moment " + (d.i + 1) + " sur " + MOMENTS.length + " ·";
    elTit.textContent = d.nom; elTxt.textContent = d.txt;
    carte.classList.add("on");
  }
  function fermer() { carte.classList.remove("on"); }
  document.getElementById("carteFermer").addEventListener("click", fermer);
  window.addEventListener("keydown", function (e) { if (e.key === "Escape") fermer(); });

  // ===== liste accessible (clavier) =====
  var srl = document.getElementById("srList");
  MOMENTS.forEach(function (m, i) {
    var b = document.createElement("button"); b.type = "button"; b.textContent = m.nom;
    b.addEventListener("click", function () {
      var p = milestones[i].position.clone().applyEuler(new THREE.Euler(rotX, rotY, 0));
      targetRY -= Math.atan2(p.x, p.z) * 0.6;
      ouvrir(milestones[i].userData);
    });
    srl.appendChild(b);
  });

  // ===== boucle =====
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize); resize();

  var clock = 0;
  function loop() {
    requestAnimationFrame(loop);
    if (document.hidden) return;
    clock += 0.016;
    if (auto) targetRY += 0.0009;
    rotX += (targetRX - rotX) * 0.06;
    rotY += (targetRY - rotY) * 0.06;
    group.rotation.x = rotX; group.rotation.y = rotY;
    if (!reduce) {
      for (var i = 0; i < milestones.length; i++) {
        var s = milestones[i], k = 1 + Math.sin(clock * 1.3 + i) * 0.12;
        s.scale.set(s.userData.base * k, s.userData.base * k, 1);
      }
      neb.material.opacity = 0.18 + Math.sin(clock * 0.5) * 0.05;
    }
    renderer.render(scene, camera);
  }
  renderer.render(scene, camera); // premier rendu immediat (visible des le chargement)
  loop();
})();
</script>
  <script src="/presence.js" defer></script>
</body>
</html>
